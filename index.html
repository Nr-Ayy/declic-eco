<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Déclic Éco</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f7f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    background: white;
    width: 100%;
    max-width: 550px;
    padding: 35px 25px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.center { text-align: center; }

h1 { font-size: 38px; margin: 10px 0; }

h2 {
    font-size: 23px;
    line-height: 1.4;
}

.leaf { font-size: 50px; }

.subtitle {
    color: #555;
    line-height: 1.5;
    font-size: 17px;
}

.progress {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
}

.choice {
    display: block;
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: white;
    font-size: 16px;
    cursor: pointer;
    text-align: left;
}

.choice:hover { background: #f4f7f5; }

.choice:disabled {
    cursor: default;
}

.correct {
    background: #e5f5e9;
    border-color: #7bb88a;
}

.wrong {
    background: #fdeaea;
    border-color: #d78b8b;
}

.main-button {
    border: none;
    border-radius: 12px;
    padding: 15px 28px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

.explanation {
    display: none;
    margin-top: 20px;
    padding: 15px;
    border-radius: 12px;
    background: #f4f7f5;
    line-height: 1.5;
}

.source {
    margin-top: 8px;
    font-size: 12px;
    color: #777;
}

#quiz, #resultat {
    display: none;
}
</style>
</head>

<body>

<div class="card">

    <!-- ACCUEIL -->
    <div id="accueil" class="center">
        <div class="leaf">🌱</div>
        <h1>Déclic Éco</h1>

        <p class="subtitle">
            Testez vos connaissances sur l'environnement
            à travers 5 questions courtes et ludiques.
        </p>

        <p><strong>5 questions • Quelques minutes</strong></p>

        <button class="main-button" onclick="commencerQuiz()">
            Commencer
        </button>
    </div>


    <!-- QUIZ -->
    <div id="quiz">

        <div class="progress" id="progression"></div>

        <div id="theme"></div>

        <h2 id="question"></h2>

        <div id="choix"></div>

        <div class="explanation" id="explication">
            <div id="texteExplication"></div>
            <div class="source" id="source"></div>
        </div>

        <button
            class="main-button"
            id="suivant"
            onclick="questionSuivante()"
            style="display:none;">
            Question suivante
        </button>

    </div>


    <!-- RESULTAT -->
    <div id="resultat" class="center">

        <div class="leaf">🌱</div>

        <h1>Session terminée !</h1>
        
        <h2 id="score"></h2>

    <p id="messageScore" class="subtitle"></p>

    <p class="subtitle">
        <strong>Chaque geste compte.</strong><br>
        Tu viens déjà d’apprendre quelque chose.<br>
        Reviens tenter le défi et partage un écogeste avec ton équipe.
    </p>


        <h2 id="score"></h2>

        <p id="messageScore" class="subtitle"></p>

        <button class="main-button" onclick="commencerQuiz()">
            Rejouer
        </button>

    </div>

</div>


<script>

let toutesLesQuestions = [];
let questionsQuiz = [];
let indexQuestion = 0;
let score = 0;


/* Charger questions.json */

fetch("questions.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("Impossible de charger les questions.");
        }
        return response.json();
    })
    .then(data => {
        toutesLesQuestions = data;
    })
    .catch(error => {
        console.error(error);
        alert("Erreur lors du chargement des questions.");
    });


/* Mélanger un tableau */

function melanger(tableau) {
    return [...tableau].sort(() => Math.random() - 0.5);
}


/* Commencer */

function commencerQuiz() {

    if (toutesLesQuestions.length === 0) {
        alert("Les questions ne sont pas encore chargées.");
        return;
    }

    questionsQuiz = melanger(toutesLesQuestions).slice(0, 5);

    indexQuestion = 0;
    score = 0;

    document.getElementById("accueil").style.display = "none";
    document.getElementById("resultat").style.display = "none";
    document.getElementById("quiz").style.display = "block";

    afficherQuestion();
}


/* Afficher une question */

function afficherQuestion() {

    const q = questionsQuiz[indexQuestion];

    document.getElementById("progression").textContent =
        "Question " + (indexQuestion + 1) + " sur " + questionsQuiz.length;

    document.getElementById("theme").textContent =
        q.Theme ? q.Theme : "";

    document.getElementById("question").textContent = q.Question;

    document.getElementById("explication").style.display = "none";
    document.getElementById("suivant").style.display = "none";

    const zoneChoix = document.getElementById("choix");
    zoneChoix.innerHTML = "";

    const choix = [
        q.Choix1,
        q.Choix2,
        q.Choix3,
        q.Choix4
    ].filter(c => c && c.trim() !== "");

    choix.forEach(reponse => {

        const bouton = document.createElement("button");

        bouton.className = "choice";
        bouton.textContent = reponse;

        bouton.onclick = function() {
            verifierReponse(bouton, reponse);
        };

        zoneChoix.appendChild(bouton);
    });
}


/* Vérifier réponse */

function verifierReponse(boutonClique, reponse) {

    const q = questionsQuiz[indexQuestion];

    const boutons = document.querySelectorAll(".choice");

    boutons.forEach(b => {
        b.disabled = true;

        if (b.textContent === q.BonneReponse) {
            b.classList.add("correct");
        }
    });

    if (reponse === q.BonneReponse) {
        score++;
    } else {
        boutonClique.classList.add("wrong");
    }

    document.getElementById("texteExplication").textContent =
        q.Explication;

    document.getElementById("source").textContent =
        q.Source ? "Source : " + q.Source : "";

    document.getElementById("explication").style.display = "block";
    document.getElementById("suivant").style.display = "inline-block";
}


/* Question suivante */

function questionSuivante() {

    indexQuestion++;

    if (indexQuestion < questionsQuiz.length) {
        afficherQuestion();
    } else {
        afficherResultat();
    }
}


/* Résultat */

function afficherResultat() {

    document.getElementById("quiz").style.display = "none";
    document.getElementById("resultat").style.display = "block";

    document.getElementById("score").textContent =
        score + " / " + questionsQuiz.length;

    let message = "";

    if (score === questionsQuiz.length) {
        message = "Excellent ! Vous maîtrisez le sujet 🌱";
    }
    else if (score >= 3) {
        message = "Bien joué ! Encore quelques découvertes à faire.";
    }
    else {
        message = "Chaque question est une occasion d'en apprendre davantage.";
    }

    document.getElementById("messageScore").textContent = message;
}

</script>

</body>
</html>
